<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#161616"/>
  <!-- grid -->
  <g stroke="#2a2a2a" stroke-width="1">
    <line x1="100" y1="80" x2="100" y2="400"/>
    <line x1="220" y1="80" x2="220" y2="400"/>
    <line x1="340" y1="80" x2="340" y2="400"/>
    <line x1="460" y1="80" x2="460" y2="400"/>
    <line x1="580" y1="80" x2="580" y2="400"/>
    <line x1="700" y1="80" x2="700" y2="400"/>
    <line x1="100" y1="140" x2="700" y2="140"/>
    <line x1="100" y1="205" x2="700" y2="205"/>
    <line x1="100" y1="270" x2="700" y2="270"/>
    <line x1="100" y1="335" x2="700" y2="335"/>
  </g>
  <!-- axes -->
  <g stroke="#6b7280" stroke-width="2">
    <line x1="100" y1="400" x2="720" y2="400"/>
    <line x1="100" y1="400" x2="100" y2="70"/>
  </g>
  <!-- cutoff markers -->
  <g stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="300" y1="120" x2="300" y2="400"/>
    <line x1="500" y1="120" x2="500" y2="400"/>
  </g>
  <!-- bandpass magnitude response -->
  <path d="M 110 392
           C 200 390, 240 380, 268 300
           C 285 240, 292 128, 310 122
           L 490 122
           C 508 128, 515 240, 532 300
           C 560 380, 600 390, 690 392"
        fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <!-- passband fill -->
  <path d="M 310 122 L 490 122 C 508 128, 515 240, 532 300 C 545 340, 560 370, 575 385 L 575 400 L 225 400 L 225 385 C 240 370, 255 340, 268 300 C 285 240, 292 128, 310 122 Z"
        fill="#34d399" opacity="0.08"/>
  <!-- labels -->
  <g fill="#9ca3af" font-family="Menlo, monospace" font-size="22">
    <text x="60" y="90">|H(f)|</text>
    <text x="705" y="435">f</text>
    <text x="282" y="435">fc1</text>
    <text x="483" y="435">fc2</text>
    <text x="360" y="105" fill="#e5e7eb">passband</text>
  </g>
  <g fill="#6b7280" font-family="Menlo, monospace" font-size="18">
    <text x="120" y="60">FIR Bandpass Filter — magnitude response</text>
  </g>
</svg>
